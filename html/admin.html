<!DOCTYPE html>
<html lang="vi">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Admin - StayEasy</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="css/style.css">
   </head>
   <body class="bg-light">
      <nav class="navbar navbar-dark bg-dark shadow mb-4">
         <div class="container-fluid">
            <a class="navbar-brand" href="index.html">⚙️ StayEasy Admin Panel</a>
            <a class="btn btn-outline-light btn-sm" href="index.html">Trang Khách</a>
         </div>
      </nav>

      <div class="container-fluid px-4">
         <ul class="nav nav-tabs mb-4" id="adminTabs">
            <li class="nav-item">
               <a class="nav-link active fw-bold" data-bs-toggle="tab" href="#roomsTab">🏨 Quản lý Phòng</a>
            </li>
            <li class="nav-item">
               <a class="nav-link fw-bold" data-bs-toggle="tab" href="#bookingsTab">📝 Quản lý Đặt phòng</a>
            </li>
         </ul>

         <div class="tab-content">
            <div class="tab-pane fade show active admin-table-container" id="roomsTab">
               <button class="btn btn-success mb-3" id="btnAddRoom">+ Thêm phòng mới</button>
               <div class="table-responsive">
                  <table class="table table-hover align-middle">
                     <thead class="table-dark">
                        <tr>
                           <th>ID</th>
                           <th>Ảnh</th>
                           <th>Tên phòng</th>
                           <th>Loại</th>
                           <th>Sức chứa</th>
                           <th>Giá (VND)</th>
                           <th>Hành động</th>
                        </tr>
                     </thead>
                     <tbody id="admin-room-list"></tbody>
                  </table>
               </div>
            </div>

            <div class="tab-pane fade admin-table-container" id="bookingsTab">
               <div class="table-responsive">
                  <table class="table table-hover align-middle">
                     <thead class="table-dark">
                        <tr>
                           <th>Mã Đơn</th>
                           <th>ID Phòng</th>
                           <th>Khách hàng</th>
                           <th>Check-in</th>
                           <th>Check-out</th>
                           <th>Tổng tiền</th>
                           <th>Trạng thái</th>
                           <th>Duyệt</th>
                        </tr>
                     </thead>
                     <tbody id="admin-booking-list"></tbody>
                  </table>
               </div>
            </div>
         </div>
      </div>

      <div class="modal fade" id="roomModal" tabindex="-1">
         <div class="modal-dialog">
            <div class="modal-content">
               <div class="modal-header bg-dark text-white">
                  <h5 class="modal-title" id="roomModalTitle">Thêm phòng mới</h5>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
               </div>
               <div class="modal-body">
                  <form id="adminRoomForm">
                     <input type="hidden" id="editRoomId">
                     <div class="mb-2"><label>Tên phòng</label><input type="text" id="rName" class="form-control"
                           required></div>
                     <div class="mb-2"><label>Loại (Standard/VIP...)</label><input type="text" id="rType"
                           class="form-control" required></div>
                     <div class="mb-2"><label>Giá tiền (Số)</label><input type="number" id="rPrice" class="form-control"
                           required></div>
                     <div class="mb-2"><label>Sức chứa (Người)</label><input type="number" id="rCap"
                           class="form-control" required></div>
                     <div class="mb-2"><label>Link Ảnh</label><input type="text" id="rImg" class="form-control"
                           required></div>
                     <button type="submit" class="btn btn-primary w-100 mt-3">Lưu thông tin</button>
                  </form>
               </div>
            </div>
         </div>
      </div>

      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <script src="js/utils.js"></script>
      <script src="js/api.js"></script>
      <script src="js/admin.js"></script>
   </body>
</html>
