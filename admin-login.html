<!DOCTYPE html>
<html lang="vi">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hệ thống Xác thực Quản trị - StayEasy</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      <style>
         :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
         }

         body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
         }

         /* --- BACKGROUND ABSTRACT SANG TRỌNG --- */
         body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.05), rgba(15, 23, 42, 0.2)),
               url('https://files.123freevectors.com/wp-content/original/119227-blue-and-white-abstract-background-image.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
         }

         /* --- KHỐI FORM CARD TỐI GIẢN THEO MẪU --- */
         .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 440px;
            max-width: 90vw;
            padding: 40px;
            border: 1px solid #e2e8f0;
         }

         .brand-header {
            text-align: center;
            margin-bottom: 32px;
         }

         .brand-logo {
            width: 48px;
            height: 48px;
            background-color: var(--primary-color);
            color: #ffffff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
         }

         .brand-title {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 1.35rem;
            margin: 0;
            letter-spacing: -0.5px;
         }

         .brand-title span {
            color: var(--primary-color);
         }

         /* --- THANH ĐIỀU HƯỚNG TAB MENU --- */
         .auth-nav {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
            justify-content: center;
            gap: 20px;
         }

         .auth-nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 4px;
            position: relative;
            transition: all 0.2s ease;
         }

         .auth-nav-btn:hover {
            color: var(--primary-color);
         }

         .auth-nav-btn.active {
            color: var(--primary-color);
         }

         .auth-nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
            border-radius: 2px;
         }

         /* --- CẤU TRÚC PHẦN TỬ TRƯỜNG NHẬP LIỆU --- */
         .form-group-custom {
            margin-bottom: 20px;
         }

         .form-label-custom {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            display: block;
         }

         .input-wrapper {
            position: relative;
            width: 100%;
         }

         /* Icon biểu tượng cố định bên trái */
         .input-wrapper>i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 5;
         }

         .input-custom,
         .select-custom {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-dark);
            background-color: #ffffff;
            transition: all 0.2s ease;
            outline: none;
            display: block;
         }

         /* Tránh chữ bị đè dưới nút con mắt */
         .input-password-padding {
            padding-right: 46px !important;
         }

         .input-custom:focus,
         .select-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
         }

         .input-custom::placeholder {
            color: #94a3b8;
         }

         /* --- ĐỊNH VỊ NÚT CON MẮT CHUẨN XÁC GIỮA KHUNG --- */
         .password-toggle-icon {
            position: absolute;
            right: 14px;
            top: 0;
            bottom: 0;
            margin: auto 0;
            height: max-content;
            color: #94a3b8;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
         }

         .password-toggle-icon:hover {
            color: #475569;
         }

         /* --- NÚT BẤM CHÍNH --- */
         .btn-submit-custom {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 11px;
            border: none;
            border-radius: 8px;
            width: 100%;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            margin-top: 8px;
         }

         .btn-submit-custom:hover {
            background-color: var(--primary-hover);
         }

         .form-pane {
            display: none;
         }

         .form-pane.active {
            display: block;
         }
      </style>
   </head>
   <body>

      <div class="login-card">
         <div class="brand-header">
            <div class="brand-logo">
               <i class="bi bi-airplane-engines-fill"></i>
            </div>
            <h2 class="brand-title">StayEasy <span>Hub</span></h2>
         </div>

         <div class="auth-nav">
            <button type="button" class="auth-nav-btn active" data-target="#pane-login">Đăng nhập</button>
            <button type="button" class="auth-nav-btn" data-target="#pane-register">Cấp tài khoản mới</button>
         </div>

         <div class="form-pane active" id="pane-login">
            <form id="loginForm">
               <div class="form-group-custom">
                  <label class="form-label-custom">Email quản trị</label>
                  <div class="input-wrapper">
                     <i class="bi bi-envelope"></i>
                     <input type="email" id="loginEmail" class="input-custom" placeholder="admin@gmail.com" required>
                  </div>
               </div>
               <div class="form-group-custom">
                  <label class="form-label-custom">Mật khẩu</label>
                  <div class="input-wrapper">
                     <i class="bi bi-lock"></i>
                     <input type="password" id="loginPassword" class="input-custom input-password-padding"
                        placeholder="••••••••" required>
                     <button type="button" class="password-toggle-icon"><i class="bi bi-eye"></i></button>
                  </div>
               </div>
               <button type="submit" class="btn-submit-custom">Đăng nhập ngay</button>
            </form>
         </div>

         <div class="form-pane" id="pane-register">
            <form id="registerForm">
               <div class="form-group-custom">
                  <label class="form-label-custom">Tên thành viên</label>
                  <div class="input-wrapper">
                     <i class="bi bi-person"></i>
                     <input type="text" id="regName" class="input-custom" placeholder="Nguyễn Văn A" required>
                  </div>
               </div>
               <div class="form-group-custom">
                  <label class="form-label-custom">Địa chỉ Email cấp</label>
                  <div class="input-wrapper">
                     <i class="bi bi-envelope-plus"></i>
                     <input type="email" id="regEmail" class="input-custom" placeholder="nhanvien@stayeasy.vn" required>
                  </div>
               </div>
               <div class="form-group-custom">
                  <label class="form-label-custom">Mật khẩu cấp quyền</label>
                  <div class="input-wrapper">
                     <i class="bi bi-key"></i>
                     <input type="password" id="regPassword" class="input-custom" placeholder="Tối thiểu 6 ký tự"
                        required>
                  </div>
               </div>
               <div class="form-group-custom">
                  <label class="form-label-custom">Phân cấp vai trò</label>
                  <div class="input-wrapper">
                     <i class="bi bi-shield-check"></i>
                     <select id="regRole" class="select-custom" required>
                        <option value="admin" selected>Quản trị viên (Admin)</option>
                        <option value="moderator">Điều phối viên</option>
                     </select>
                  </div>
               </div>
               <button type="submit" class="btn-submit-custom"
                  style="background-color: #0f172a; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.2);">Khởi tạo tài
                  khoản</button>
            </form>
         </div>
      </div>

      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

      <script>
         $(document).ready(function () {
            function getFreshAccounts() {
               let accounts = JSON.parse(localStorage.getItem('stayeasy_admin_accounts')) || [];
               const hasAdmin = accounts.some(u => u.email === "admin@gmail.com");
               if (!hasAdmin) {
                  accounts.push({
                     name: "Quản Trị Viên",
                     email: "admin@gmail.com",
                     password: "admin",
                     role: "admin"
                  });
                  localStorage.setItem('stayeasy_admin_accounts', JSON.stringify(accounts));
               }
               return accounts;
            }

            getFreshAccounts();

            $('.auth-nav-btn').on('click', function () {
               $('.auth-nav-btn').removeClass('active');
               $(this).addClass('active');
               const targetPane = $(this).attr('data-target');
               $('.form-pane').removeClass('active');
               $(targetPane).addClass('active');
            });

            $('.password-toggle-icon').on('click', function () {
               const input = $(this).siblings('input');
               const icon = $(this).find('i');
               if (input.attr('type') === 'password') {
                  input.attr('type', 'text');
                  icon.removeClass('bi-eye').addClass('bi-eye-slash');
               } else {
                  input.attr('type', 'password');
                  icon.removeClass('bi-eye-slash').addClass('bi-eye');
               }
            });

            $('#loginForm').on('submit', function (e) {
               e.preventDefault();
               const email = $('#loginEmail').val().trim();
               const password = $('#loginPassword').val();
               const currentAccounts = getFreshAccounts();
               const matchedUser = currentAccounts.find(u => u.email === email && u.password === password);

               if ((email === "admin@gmail.com" && password === "admin") || matchedUser) {
                  localStorage.setItem('isLoggedIn', 'true');
                  localStorage.setItem('userRole', 'admin');
                  localStorage.setItem('userName', matchedUser ? matchedUser.name : "Tổng Quản Trị Viên");
                  alert("🎉 Đăng nhập thành công! Đang chuyển hướng vào hệ thống...");
                  window.location.href = 'admin.html';
               } else {
                  alert("❌ Tài khoản quản trị hoặc mật khẩu không chính xác.");
               }
            });

            $('#registerForm').on('submit', function (e) {
               e.preventDefault();
               const name = $('#regName').val().trim();
               const email = $('#regEmail').val().trim();
               const password = $('#regPassword').val();
               const role = $('#regRole').val();
               let currentAccounts = JSON.parse(localStorage.getItem('stayeasy_admin_accounts')) || [];

               if (currentAccounts.some(u => u.email.toLowerCase() === email.toLowerCase()) || email === "admin@gmail.com") {
                  alert("⚠️ Email này đã được đăng ký cấp quyền hệ thống!");
                  return;
               }

               currentAccounts.push({ name, email, password, role });
               localStorage.setItem('stayeasy_admin_accounts', JSON.stringify(currentAccounts));
               alert(`✅ Cấp tài khoản thành công cho nhân sự: ${name}`);
               $('#registerForm')[0].reset();
               location.reload();
            });
         });
      </script>
   </body>
</html>
