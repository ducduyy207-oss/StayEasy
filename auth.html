<!DOCTYPE html>
<html lang="vi">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>StayEasy - Đăng ký / Đăng nhập</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
         :root {
            --primary-color: #0d6efd;
            --primary-hover: #0b5ed7;
            --text-color: #333;
         }

         body {
            background: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.3)),
               url('https://images.unsplash.com/photo-1528127269322-539801943592?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         }

         @keyframes slideInUp {
            from {
               transform: translateY(40px);
               opacity: 0;
            }

            to {
               transform: translateY(0);
               opacity: 1;
            }
         }

         .auth-container {
            max-width: 900px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            min-height: 550px;
            animation: slideInUp 0.8s ease-out forwards;
         }

         /* --- CỘT TRÁI: FORM --- */
         .form-section {
            padding: 40px 50px 20px 50px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
         }

         .auth-title {
            color: var(--primary-color);
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.6rem;
         }

         /* Các nút MXH */
         .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
         }

         .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #ced4da;
            color: #555;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.95rem;
         }

         .social-icons a:hover {
            border-color: var(--primary-color);
            color: white;
            background-color: var(--primary-color);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
         }

         .divider-text {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 15px;
         }

         /* Form Inputs */
         .form-control {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #333;
            background-color: #fff;
            transition: all 0.3s;
         }

         .form-control::placeholder {
            color: #999;
         }

         .form-control:focus {
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
            border-color: #86b7fe;
            transform: translateY(-2px);
         }

         /* Checkbox */
         .form-check {
            margin-bottom: 20px;
         }

         .form-check-label {
            font-size: 0.8rem;
            color: #555;
         }

         .form-check-label a {
            color: var(--primary-color);
            text-decoration: none;
            transition: 0.2s;
         }

         .form-check-label a:hover {
            text-decoration: underline;
         }

         .form-check-input {
            border-color: var(--primary-color);
         }

         .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
         }

         /* Buttons */
         .action-buttons {
            display: flex;
            gap: 15px;
         }

         .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
         }

         .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
         }

         .btn-primary-custom {
            background-color: var(--primary-color);
            color: white;
            border: 1px solid var(--primary-color);
         }

         .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
         }

         .btn-outline-custom {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
         }

         .btn-outline-custom:hover {
            background-color: #f0f6ff;
            color: var(--primary-color);
         }

         /* Logo */
         .logo-bottom {
            text-align: center;
            margin-top: auto;
            padding-top: 20px;
         }

         .logo-bottom a {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
         }

         .logo-bottom a:hover {
            transform: scale(1.05);
         }

         .logo-bottom i {
            font-size: 1.3rem;
         }

         /* --- CỘT PHẢI: ẢNH CHỮ NHẬT --- */
         .image-section {
            width: 50%;
            background-color: #fff;
            display: flex;
            padding: 0;
         }

         .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* Đảm bảo hình ảnh được căn giữa đẹp mắt */
            border-radius: 0 20px 20px 0;
         }

         /* Responsive Mobile */
         @media (max-width: 768px) {
            .auth-container {
               flex-direction: column;
            }

            .form-section {
               width: 100%;
               padding: 30px 20px;
            }

            .image-section {
               display: none;
            }
         }

         /* Ẩn các trường không dùng khi đổi form */
         .hidden {
            display: none !important;
         }
      </style>
   </head>
   <body>

      <div class="auth-container">
         <div class="form-section">
            <h2 class="auth-title" id="formTitle">Create Account</h2>

            <div class="social-icons">
               <a href="#"><i class="bi bi-google"></i></a>
               <a href="#"><i class="bi bi-facebook"></i></a>
               <a href="#"><i class="bi bi-twitter-x"></i></a>
               <a href="#"><i class="bi bi-apple"></i></a>
            </div>

            <p class="divider-text" id="dividerText">or use your email for registration:</p>

            <form id="authForm">
               <input type="text" class="form-control" id="nameInput" placeholder="Name" required>
               <input type="email" class="form-control" id="emailInput" placeholder="Email" required>

               <div class="position-relative">
                  <input type="password" class="form-control" id="passwordInput" placeholder="Password" required>
                  <i class="bi bi-eye text-secondary position-absolute toggle-password"
                     style="top: 10px; right: 15px; cursor: pointer; transition: 0.3s;"></i>
               </div>

               <div class="position-relative" id="confirmPasswordGroup">
                  <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm Password"
                     required>
                  <i class="bi bi-eye text-secondary position-absolute toggle-password"
                     style="top: 10px; right: 15px; cursor: pointer; transition: 0.3s;"></i>
               </div>

               <div class="form-check" id="termsGroup">
                  <input class="form-check-input" type="checkbox" id="termsCheck" checked required>
                  <label class="form-check-label" for="termsCheck">
                     I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
                  </label>
               </div>

               <div class="action-buttons">
                  <button type="submit" class="btn btn-action btn-primary-custom" id="mainSubmitBtn">Sign Up</button>
                  <button type="button" class="btn btn-action btn-outline-custom" id="switchFormBtn">Sign In</button>
               </div>
            </form>

            <div class="logo-bottom">
               <a href="index.html">
                  <i class="bi bi-buildings-fill"></i> StayEasy
               </a>
            </div>
         </div>

         <div class="image-section">
            <img
               src="https://img.magnific.com/premium-vector/group-young-tourist-characters-traveling-tourists-with-travel-backpack-going-vacation-trip-after-covid-19-virus-was-diminish-vacation-people-isolated-vector-summer-character-woman-man_37895-614.jpg"
               alt="Du lịch minh họa">
         </div>
      </div>

      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <script>
         $(document).ready(function () {
            let isSignUp = true;

            // Chức năng Ẩn/Hiện mật khẩu
            $('.toggle-password').on('click', function () {
               const input = $(this).siblings('input');
               if (input.attr('type') === 'password') {
                  input.attr('type', 'text');
                  $(this).removeClass('bi-eye').addClass('bi-eye-slash');
               } else {
                  input.attr('type', 'password');
                  $(this).removeClass('bi-eye-slash').addClass('bi-eye');
               }
            });

            // Chuyển đổi giữa Form Đăng ký và Đăng nhập
            $('#switchFormBtn').on('click', function () {
               isSignUp = !isSignUp;

               if (isSignUp) {
                  $('#formTitle').text('Create Account');
                  $('#dividerText').text('or use your email for registration:');
                  $('#nameInput').removeClass('hidden').prop('required', true);
                  $('#confirmPasswordGroup').removeClass('hidden').find('input').prop('required', true);
                  $('#termsGroup').removeClass('hidden');
                  $('#mainSubmitBtn').text('Sign Up');
                  $(this).text('Sign In');
               } else {
                  $('#formTitle').text('Welcome Back');
                  $('#dividerText').text('or use your email for login:');
                  $('#nameInput').addClass('hidden').prop('required', false);
                  $('#confirmPasswordGroup').addClass('hidden').find('input').prop('required', false);
                  $('#termsGroup').addClass('hidden');
                  $('#mainSubmitBtn').text('Sign In');
                  $(this).text('Sign Up');
               }

               // Reset form khi chuyển
               $('#authForm')[0].reset();
            });

            // Xử lý Gửi Form
            $('#authForm').on('submit', function (e) {
               e.preventDefault();

               const email = $('#emailInput').val();
               const password = $('#passwordInput').val();

               if (isSignUp) {
                  // Logic xử lý đăng ký
                  const confirmPassword = $('#confirmPasswordInput').val();
                  if (password !== confirmPassword) {
                     alert("Mật khẩu xác nhận không khớp!");
                     return;
                  }
                  alert("Đăng ký thành công! Bạn có thể đăng nhập ngay.");
                  $('#switchFormBtn').click(); // Chuyển sang form đăng nhập
               } else {
                  // Logic xử lý đăng nhập - Đặc quyền Admin
                  if (email === 'admin@gmail.com' && password === 'admin123') {
                     // 1. Cấp quyền Admin
                     localStorage.setItem('isLoggedIn', 'true');
                     localStorage.setItem('userRole', 'admin');

                     alert("Đăng nhập Admin thành công!");
                     // 2. Chuyển hướng sang trang quản trị
                     window.location.href = 'admin.html';
                  } else {
                     // Logic giả lập cho khách hàng bình thường (nếu cần)
                     alert("Sai tài khoản hoặc mật khẩu (Tài khoản thử nghiệm: admin@gmail.com / admin123)");
                  }
               }
            });
         });
         // BỔ SUNG: XỬ LÝ NÚT ĐĂNG NHẬP MẠNG XÃ HỘI (POPUP GIẢ LẬP)
         $('.social-icons a').on('click', function (e) {
            e.preventDefault();

            // 1. Xác định nền tảng đang click
            let iconClass = $(this).find('i').attr('class');
            let platform = "Mạng xã hội";
            if (iconClass.includes('google')) platform = "Google";
            if (iconClass.includes('facebook')) platform = "Facebook";
            if (iconClass.includes('twitter')) platform = "X (Twitter)";
            if (iconClass.includes('apple')) platform = "Apple";

            // 2. Mở popup ở giữa màn hình giống web thật
            const w = 450, h = 550;
            const left = (screen.width / 2) - (w / 2);
            const top = (screen.height / 2) - (h / 2);
            const popup = window.open('', 'SocialLogin', `width=${w},height=${h},top=${top},left=${left}`);

            // 3. Giao diện loading mượt mà bên trong popup
            popup.document.write(`
                    <div style="font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; margin-top: 45%;">
                        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #0d6efd; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
                        <h3 style="color: #333;">Đang kết nối với ${platform}...</h3>
                        <p style="color: #666;">Hệ thống đang đồng bộ danh tính của bạn.</p>
                    </div>
                `);

            // 4. Tự động đóng popup và đăng nhập sau 2.5 giây
            setTimeout(() => {
               popup.close();

               // Cấp quyền khách hàng bình thường (khác với quyền admin)
               localStorage.setItem('isLoggedIn', 'true');
               localStorage.setItem('userRole', 'customer');
               localStorage.setItem('userName', 'Khách ' + platform);

               // Chuyển hướng về trang chủ
               window.location.href = 'index.html';
            }, 2500);
         });
      </script>
   </body>
</html>
